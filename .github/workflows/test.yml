name: test
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[ocr]"
      - run: python -m unittest discover -s tests -v
      - run: KJOBSCORE_HOME=$RUNNER_TEMP/kj k-jobscore init && KJOBSCORE_HOME=$RUNNER_TEMP/kj k-jobscore doctor || true
